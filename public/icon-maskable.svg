<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A3B2F" />
      <stop offset="100%" stop-color="#0F241C" />
    </linearGradient>
    <linearGradient id="goldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3C669" />
      <stop offset="100%" stop-color="#C98A3C" />
    </linearGradient>
    <filter id="shadowMask" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed background for maskable icon -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Center all essential content in 80% safe zone (padding ~50px) -->
  <g filter="url(#shadowMask)" transform="translate(51.2, 51.2) scale(0.8)">
    <!-- Graduation Cap / Academy Roof -->
    <path d="M 256 100 L 416 180 L 256 260 L 96 180 Z" fill="url(#goldGradMask)" />
    <!-- Tassel -->
    <path d="M 400 190 L 400 280 L 416 295 L 390 295 L 400 280" fill="#F3C669" stroke="#A76E24" stroke-width="2" />
    <circle cx="400" cy="188" r="6" fill="#F3C669" />

    <!-- Cap Base Arc -->
    <path d="M 160 215 L 160 290 C 160 340 352 340 352 290 L 352 215" fill="none" stroke="url(#goldGradMask)" stroke-width="14" stroke-linecap="round" />

    <!-- Classroom Seating Grid Visual (3x2 Desk arrangement) -->
    <!-- Desk Row 1 -->
    <rect x="156" y="340" width="56" height="34" rx="8" fill="#F2EFE9" />
    <rect x="228" y="340" width="56" height="34" rx="8" fill="#F2EFE9" />
    <rect x="300" y="340" width="56" height="34" rx="8" fill="#F2EFE9" />

    <!-- Desk Row 2 -->
    <rect x="156" y="394" width="56" height="34" rx="8" fill="url(#goldGradMask)" />
    <rect x="228" y="394" width="56" height="34" rx="8" fill="url(#goldGradMask)" />
    <rect x="300" y="394" width="56" height="34" rx="8" fill="url(#goldGradMask)" />
  </g>
</svg>
